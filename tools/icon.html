<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}svg{display:block}</style></head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6E5BFF"/>
      <stop offset="0.55" stop-color="#B14FE6"/>
      <stop offset="1" stop-color="#FF6A8E"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.22" cy="0.18" r="0.7">
      <stop offset="0" stop-color="#fff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fur" cx="0.38" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#FFFCF6"/>
      <stop offset="0.6" stop-color="#FBEBD6"/>
      <stop offset="1" stop-color="#E9C9A6"/>
    </radialGradient>
    <radialGradient id="paw" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#FFFCF6"/>
      <stop offset="1" stop-color="#EBCCAA"/>
    </radialGradient>
    <linearGradient id="remote" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#4A4A58"/>
      <stop offset="1" stop-color="#1C1C24"/>
    </linearGradient>
    <linearGradient id="power" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF7A6E"/>
      <stop offset="1" stop-color="#E5231B"/>
    </linearGradient>
    <linearGradient id="ear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFB3C7"/>
      <stop offset="1" stop-color="#FF8FB0"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="26" stdDeviation="22" flood-color="#2A0B4A" flood-opacity="0.42"/>
    </filter>
    <filter id="softshadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#2A0B4A" flood-opacity="0.3"/>
    </filter>
    <filter id="blur" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="16"/></filter>
    <radialGradient id="spec" cx="0.32" cy="0.26" r="0.4"><stop offset="0" stop-color="#fff" stop-opacity="0.55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>

  <!-- body -->
  <g filter="url(#shadow)">
    <ellipse cx="512" cy="830" rx="236" ry="176" fill="url(#fur)"/>
  </g>

  <!-- head with ears -->
  <g filter="url(#shadow)">
    <path d="M334 372 C 304 310, 306 212, 338 176 C 378 190, 432 234, 470 268 Z" fill="url(#fur)"/>
    <path d="M690 372 C 720 310, 718 212, 686 176 C 646 190, 592 234, 554 268 Z" fill="url(#fur)"/>
    <circle cx="512" cy="470" r="250" fill="url(#fur)"/>
  </g>
  <circle cx="512" cy="470" r="250" fill="url(#spec)"/>
  <path d="M356 334 C 342 290, 346 236, 362 212 C 390 226, 420 252, 442 274 Z" fill="url(#ear)"/>
  <path d="M668 334 C 682 290, 678 236, 662 212 C 634 226, 604 252, 582 274 Z" fill="url(#ear)"/>

  <!-- cheeks -->
  <circle cx="392" cy="526" r="34" fill="#FF9DB8" opacity="0.55" filter="url(#blur)"/>
  <circle cx="632" cy="526" r="34" fill="#FF9DB8" opacity="0.55" filter="url(#blur)"/>

  <!-- happy closed eyes -->
  <path d="M398 456 Q 436 404 474 456" fill="none" stroke="#2A2733" stroke-width="18" stroke-linecap="round"/>
  <path d="M550 456 Q 588 404 626 456" fill="none" stroke="#2A2733" stroke-width="18" stroke-linecap="round"/>

  <!-- nose and smile -->
  <path d="M494 502 L 530 502 L 512 526 Z" fill="#FF7FA3" stroke="#FF7FA3" stroke-width="8" stroke-linejoin="round"/>
  <path d="M470 538 Q 491 572 512 538 Q 533 572 554 538" fill="none" stroke="#2A2733" stroke-width="13" stroke-linecap="round"/>

  <!-- whiskers -->
  <g stroke="#2A2733" stroke-width="7" stroke-linecap="round" opacity="0.6">
    <path d="M300 520 L 372 530"/><path d="M304 566 L 374 556"/>
    <path d="M724 520 L 652 530"/><path d="M720 566 L 650 556"/>
  </g>

  <!-- remote -->
  <g filter="url(#shadow)">
    <rect x="446" y="612" width="132" height="330" rx="40" fill="url(#remote)"/>
  </g>
  <rect x="452" y="618" width="120" height="110" rx="34" fill="#fff" opacity="0.06"/>
  <circle cx="512" cy="664" r="16" fill="url(#power)"/>
  <circle cx="512" cy="760" r="46" fill="none" stroke="#6E6E80" stroke-width="12"/>
  <circle cx="512" cy="760" r="15" fill="#F5F5F7"/>
  <rect x="482" y="840" width="60" height="18" rx="9" fill="#6E6E80"/>
  <rect x="482" y="878" width="60" height="18" rx="9" fill="#6E6E80"/>

  <!-- paws holding the remote -->
  <g filter="url(#softshadow)">
    <circle cx="436" cy="712" r="56" fill="url(#paw)"/>
    <circle cx="588" cy="712" r="56" fill="url(#paw)"/>
  </g>
  <g stroke="#E2B995" stroke-width="7" stroke-linecap="round" fill="none">
    <path d="M414 690 Q 420 672 428 690"/><path d="M436 684 Q 442 666 450 684"/>
    <path d="M566 690 Q 572 672 580 690"/><path d="M588 684 Q 594 666 602 684"/>
  </g>
</svg>
</body></html>
