name: Tele
options:
  bundleIdPrefix: com.willysvarela
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
configFiles:
  Debug: Local.xcconfig
  Release: Local.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
  configs:
    Release:
      TELE_DEFAULT_HOST: ""          # never ship a developer's TV address
targets:
  Tele:
    type: application
    platform: iOS
    sources:
      - path: Tele
      - path: Shared
    info:
      path: Tele/Info.plist
      properties:
        CFBundleDisplayName: Tele
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        TeleDefaultHost: $(TELE_DEFAULT_HOST)
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSLocalNetworkUsageDescription: Tele talks to your Samsung TV over the local network.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    entitlements:
      path: Tele/Tele.entitlements
      properties:
        com.apple.security.application-groups: [group.com.willysvarela.teleremote]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.willysvarela.teleremote
    dependencies:
      - target: TeleWidget
        embed: true
  TeleWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: TeleWidget
      - path: Shared
    info:
      path: TeleWidget/Info.plist
      properties:
        CFBundleDisplayName: Tele
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NSLocalNetworkUsageDescription: Tele talks to your Samsung TV over the local network.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    entitlements:
      path: TeleWidget/TeleWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.willysvarela.teleremote]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.willysvarela.teleremote.widget
        SKIP_INSTALL: true
